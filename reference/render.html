<!doctype html>
<!--
  One specimen in one look at one panel size, the way a Tesserae code page draws it.

    render.html?spec=today&look=signal&w=800&h=480[&bits=1][&empty=1]

  bits=1 applies Tesserae's mono theme (every accent ink, every tint paper); empty=1 draws with no
  data, as a new account with nothing set up sees it. Fonts and icons come from /assets/, which the
  proof server maps to a Tesserae public/ directory.
-->
<html lang="en"><head><meta charset="utf-8"><title>Mosaic specimen</title>
<link rel="stylesheet" href="/assets/fonts/faces.css">
<link rel="stylesheet" href="/assets/icons/phosphor/bold/style.css">
<link rel="stylesheet" href="/assets/icons/phosphor/fill/style.css">
<link rel="stylesheet" href="/assets/icons/phosphor/regular/style.css">
<link rel="stylesheet" href="/assets/icons/phosphor/light/style.css">
<link rel="stylesheet" href="../src/core.css">
<link rel="stylesheet" href="../src/looks/bauhaus.css">
<link rel="stylesheet" href="../src/looks/almanac.css">
<link rel="stylesheet" href="../src/looks/signal.css">
<link rel="stylesheet" href="../src/looks/pixel.css">
<link rel="stylesheet" href="../src/looks/os7.css">
<style>
/* Tesserae Cloud's paper theme, and its mono theme for a one-bit panel. */
:root{--surface:#ffffff;--surface-sunken:#EFEFEC;--ink:#000000;--text-secondary:#333333;--muted:#555555;--rule:#000000;--edge:#B7B7B2;--on-accent:#ffffff;
 --accent-1:#c8462c;--accent-2:#d9a21b;--accent-3:#4f7a3a;--accent-4:#2b7a8c;--accent-5:#3c4e8a;--accent-6:#7e4068;
 --font-sans:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace}
:root.mono{--surface-sunken:#ffffff;--text-secondary:#000000;--muted:#000000;--edge:#000000;
 --accent-1:#000000;--accent-2:#000000;--accent-3:#000000;--accent-4:#000000;--accent-5:#000000;--accent-6:#000000}
html,body{margin:0;padding:0;background:var(--surface)}
#page{position:relative;overflow:hidden}
.err{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#000;border-top:3px solid #000;font:12px/1.3 monospace;white-space:pre-wrap;padding:4px 6px;max-height:40%;overflow:hidden}
</style>
<script src="../src/mosaic.js"></script>
</head><body><div id="page"></div>
<script type="module">
import { SPECIMENS } from "./specimens.js";
const p = new URLSearchParams(location.search);
const w = +p.get("w") || 800, h = +p.get("h") || 480;
const spec = SPECIMENS.find((s) => s.id === (p.get("spec") || "today"));
const page = document.getElementById("page");
page.style.width = w + "px"; page.style.height = h + "px";
if (p.get("bits") === "1") document.documentElement.classList.add("mono");
window.__errors = [];
addEventListener("error", (e) => window.__errors.push(String(e.message || e)));
addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason && e.reason.message || e.reason)));

// A rainy spring morning in Melbourne, and a front page: the same fixture Tesserae's proofs use.
const pad = (n) => String(n).padStart(2, "0");
const now = new Date(); const h0 = new Date(now); h0.setMinutes(0, 0, 0);
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
const temps = [14, 14, 15, 16, 17, 17, 16, 15, 13, 12, 11, 10, 10, 9], rain = [60, 80, 70, 40, 30, 20, 20, 30, 40, 20, 10, 10, 5, 5];
const day = iso(now).slice(0, 10);
const data = p.get("empty") === "1" ? {} : {
  wx: { current_units: { temperature_2m: "°C" }, current: { temperature_2m: 14.2, weather_code: 61, is_day: 1 },
    hourly: { time: temps.map((_, i) => iso(new Date(h0.getTime() + i * 3600e3))), temperature_2m: temps, precipitation_probability: rain },
    daily: { temperature_2m_max: [17.4], temperature_2m_min: [8.9], sunrise: [day + "T06:58"], sunset: [day + "T19:21"] } },
  feed: { title: "Hacker News: Front Page", items: ["Show HN: I turned an old Kindle into a weather station", "The unreasonable effectiveness of e-paper", "A deep dive into ESP32 deep sleep current", "Why the humble RSS feed refuses to die", "Designing for 1-bit displays", "SQLite is not a toy database", "The return of the dumb phone", "How Cloudflare Workers handle a million requests per second", "Floyd–Steinberg dithering, explained with pictures", "Ask HN: What do you run on your home server?", "The case for boring technology, ten years on", "Postgres 19 released"].map((title) => ({ title })) },
};
const target = new Date(now.getTime() + 89 * 864e5);
const ctx = { data, errors: {}, options: { date: target.getFullYear() + "-" + pad(target.getMonth() + 1) + "-" + pad(target.getDate()), label: "Christmas", title: "" }, w, h, locale: p.get("locale") || "en", tz: "Australia/Melbourne", kv: {} };
if (p.get("empty") === "1") ctx.options.date = "";

page.innerHTML = spec.html;
if (spec.css) { const st = document.createElement("style"); st.textContent = spec.css; document.head.appendChild(st); }
page.querySelector(".m").dataset.look = p.get("look") || "signal";
try {
  await new Function("ctx", "return (async () => {" + spec.js + "})()")(ctx);
} catch (e) { window.__errors.push(String(e && e.message || e)); }
if (window.__errors.length) { const d = document.createElement("div"); d.className = "err"; d.textContent = window.__errors.join("\n"); page.appendChild(d); }
window.__ready = true;
</script></body></html>
